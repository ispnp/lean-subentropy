name = "SubentropyClassicalSSAPilot"
version = "0.1.0"
defaultTargets = ["Challenge", "Solution"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "D5"
srcDir = "vendor/upstream/module_snapshot"
globs = ["D5.+"]
weakLeanArgs = ["-j1"]

[lean_lib.leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[lean_lib]]
name = "SubentropyCertificates"
globs = ["SubentropyCertificates.+"]
moreLeanArgs = ["-DwarningAsError=true"]

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
