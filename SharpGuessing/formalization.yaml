status:
  scope: >-
    Priors may vanish and signal states may be mixed. At positive error, equality
    characterizes the identical pure signals and the stated prior up to relabeling.
    At zero error, the positive-prior signals have pairwise orthogonal supports.
    The statements include the one-label case, the optimal linear coefficient,
    and both endpoints of the inverse curve.
  sorry_count: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

