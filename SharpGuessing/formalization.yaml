version: "v0.4"

project:
  name: A sharp lower bound on quantum state discrimination error from conditional subentropy
  description: >-
    For a finite quantum ensemble with n ≥ 2 labels and optimal discrimination error e,
    the largest possible conditional subentropy is the subentropy of the prior
    (1−e, e/(n−1), …, e/(n−1)). Identical pure signals with this prior attain the bound
    at every admissible error. The inverse curve gives the minimum possible error
    at each admissible conditional subentropy, even at fixed positive signal dimension.
  authors: ["Pratik Patil"]
  responsible_maintainers: ["Pratik Patil"]
  license: "Apache-2.0"

classification:
  arxiv: ["quant-ph", "cs.IT"]
  msc2020: ["81P17", "81P18", "94A17"]

sources:
